# Mantém o projeto Supabase gratuito ativo: o plano gratuito pausa projetos sem atividade durante 7 dias.
# Faz um pedido leve à base de dados duas vezes por semana (a chave usada é a chave pública da app).
name: Manter Supabase ativo
on:
  schedule:
    - cron: '17 7 * * 1,4'   # segundas e quintas às 07:17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pedido à base de dados
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://jqclehlrcvwwklwfosjh.supabase.co/rest/v1/checklists?select=id&limit=1" \
            -H "apikey: sb_publishable_ODxw3OwUZJLsrQeU8_3RmQ_ZnwAWotD")
          echo "Resposta: $code"
          test "$code" -lt 500
      - name: Manter o agendamento ativo (o GitHub desliga agendamentos em repositórios sem commits há 60 dias)
        run: |
          echo "ok"
